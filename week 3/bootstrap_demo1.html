<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Basics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="container-fluid">
      <div class="row">
        <div class="col bg-danger py-2">
          <h1>News Website</h1>
        </div>
        <div class="col-12 bg-danger py-1 pb-5">Breaking stories, latest updates</div>
      </div>
    </div>
  </header>
  <main>
    <div class="container-fluid Main-Story">
      <div class="row">
        <div class="col-9 bg-light">Main Story - Large Image & Headline</div>
        <div class="col-3 bg-secondary Side-Stories">
          <div class="row mb-3">Side Story 1</div>
          <div class="row mb-3">Side Story 2</div>
          <div class="row mb-3">Side Story 3</div>
        </div>
      </div>
    </div>
    <div class="container-fluid Primary-Stories">
      <div class="row">
        <div class="col-3 bg-warning">Story1</div>
        <div class="col-3 bg-warning">Story2</div>
        <div class="col-3 bg-warning">Story3</div>
        <div class="col-3 bg-warning">Story4</div>
      </div>
    </div>
    <div class="container-fluid Lower-Stories">
      <div class="row">
        <div class="col-4 bg-info">Lower Story 1</div>
        <div class="col-4 bg-info">Lower Story 2</div>
        <div class="col-4 bg-info">Lower Story 3</div>
      </div>
    </div>
    <footer class="container-fluid">
      <div class="row">
        <div class="col bg-dark text-white py-3">© 2026 News Website. All rights reserved.</div>
      </div>
    </footer>
  </main>
</body>
</html>
